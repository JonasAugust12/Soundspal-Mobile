name: CD - EAS Build Production & Deploy Play Store

on:
    push:
        tags:
            - 'release-v*'
    workflow_dispatch:

jobs:
    eas-build-and-deploy:
        name: EAS Build & Fastlane Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Setup EAS CLI
              run: npm install -g eas-cli

            # google-services.json bị gitignore nên EAS không có sẵn. Ghi từ secret (base64) ra
            # workspace; .easignore (đã thêm) cho phép EAS đóng gói file này để prebuild/gradle dùng.
            - name: Provide google-services.json
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  set -euo pipefail
                  if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
                    echo "❌ Thiếu secret GOOGLE_SERVICES_JSON. Thêm ở Settings → Secrets and variables → Actions (base64 của google-services.json)."
                    exit 1
                  fi
                  echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
                  echo "✅ Wrote google-services.json for EAS build."

            # JSON is written to stdout (--json redirects normal logs to stderr)
            - name: Build Android Production on EAS
              run: eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

            # eas build:download does not support store AABs with --latest/--output; use archive URL from build JSON
            - name: Download AAB from EAS artifact
              run: |
                  set -euo pipefail
                  URL=$(jq -er '.[0].artifacts.applicationArchiveUrl' eas-build.json)
                  curl -fSL -o ./app-release.aab \
                    -H "Authorization: Bearer ${EXPO_TOKEN}" \
                    "$URL"
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

            - name: Setup Ruby & Fastlane
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.2'

            - name: Install Fastlane CLI
              run: gem install fastlane

            - name: Upload to Google Play Console via Fastlane
              run: fastlane android upload_to_playstore
              env:
                  PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

            - name: Deployment Completion
              run: echo "🎉 Successfully pushed Soundspal to Google Play Console!"
