name: CD - EAS Build Production & Deploy Play Store

on:
    push:
        tags:
            - 'release-v*'

jobs:
    eas-build-and-deploy:
        name: EAS Build & Fastlane Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # TODO: Re-enable when switching back from fixed-artifact download flow
            # - name: Setup EAS CLI
            #   run: npm install -g eas-cli

            # Step 1: Trigger the build on Expo servers and wait for completion (disabled temporarily)
            # - name: Build Android Production on EAS
            #   run: eas build --platform android --profile production --non-interactive --wait
            #   env:
            #       EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

            # Step 2: Download .aab (temporary: direct Expo artifact URL; replace URL after each build)
            # Note: eas build:download in current eas-cli targets dev/simulator builds (--fingerprint), not store AABs.
            # Long-term: use artifact URL from build logs, or eas build:submit --url ... for Play (skips separate Fastlane).
            - name: Download AAB file
              run: |
                  curl -fSL -o ./app-release.aab \
                    -H "Authorization: Bearer ${EXPO_TOKEN}" \
                    "https://expo.dev/artifacts/eas/pkB2KswagezCsQYW9obU71.aab"
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

            - name: Setup Ruby & Fastlane
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.2'

            - name: Install Fastlane CLI
              run: gem install fastlane

            - name: Upload to Google Play Console via Fastlane
              run: fastlane android upload_to_playstore
              env:
                  PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

            - name: Deployment Completion
              run: echo "🎉 Successfully pushed Soundspal to Google Play Console!"
