name: CD - EAS Build Production & Deploy Play Store

on:
    push:
        tags:
            - 'release-v*'

jobs:
    eas-build-and-deploy:
        name: EAS Build & Fastlane Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Setup EAS CLI
              run: npm install -g eas-cli

            - name: Build Android Production & Download AAB
              run: eas build --platform android --profile production --non-interactive --wait --output ./app-release.aab
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

            - name: Setup Ruby & Fastlane
              uses: ruby/setup-ruby@v1
              with:
                  ruby-version: '3.2'

            - name: Install Fastlane CLI
              run: gem install fastlane

            - name: 🚀 Upload to Google Play Console via Fastlane
              run: fastlane android upload_to_playstore
              env:
                  PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

            - name: Done
              run: echo "🎉 Pushed app Soundspal to Google Play Console successfully!"
