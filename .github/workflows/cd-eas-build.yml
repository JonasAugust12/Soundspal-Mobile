name: CD - EAS Build Production

on:
    push:
        branches: [main]

jobs:
    eas-build:
        name: EAS Build Android Production
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Setup EAS CLI
              run: npm install -g eas-cli

            - name: Build Android Production
              run: eas build --platform android --profile production --non-interactive
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

            - name: Get Build URL
              run: |
                  echo "✅ Build submitted to EAS!"
                  echo "Check your builds at: https://expo.dev/accounts/jonasaugust12/projects/talent_link/builds"
