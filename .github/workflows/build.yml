name: build

on: [push, pull_request]

jobs:
    build-android:
        name: Verify Android Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Install dependencies
              run: npm install

            # app.json trỏ googleServicesFile -> ./google-services.json (file này bị gitignore).
            # Job này chỉ VERIFY prebuild (chỉ copy file, không build gradle) nên dùng secret nếu có,
            # không thì ghi placeholder hợp lệ (đúng package_name) để prebuild chạy qua.
            - name: Provide google-services.json
              env:
                  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
              run: |
                  if [ -n "$GOOGLE_SERVICES_JSON" ]; then
                    echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
                    echo "Wrote google-services.json from secret."
                  else
                    echo "Secret GOOGLE_SERVICES_JSON not set - writing placeholder for prebuild verification."
                    echo '{"project_info":{"project_number":"000000000000","project_id":"placeholder","storage_bucket":"placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.jonasaugust12.talent_link"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > google-services.json
                  fi

            - name: Run Expo prebuild
              run: npx expo prebuild --platform android --no-install

            - name: Verify Android project structure
              run: |
                  if [ -d "android" ]; then
                    echo "✅ Android project created successfully"
                    ls -la android/
                  else
                    echo "❌ Android project not found"
                    exit 1
                  fi
